# Production-scale 12-update check with CUDA Graph capture for physics resets.
[train]
robot_xml = "../assets/q1_v3/xml/q1_v3_mc.xml"
motion_dir = "../datasets/train_50hz/motion_yuanke"
motion_pattern = "*/*.npz"
output_dir = "../logs/a6000_diag_8192"
device = "cuda:0"
motion_storage = "device"
max_motions = 16
motion_selection = "random"
num_envs = 8192
model_batch_size = 2048
policy_batch_size = 2048
iterations = 12
replay_steps = 1000
model_batches = 2
critic_epochs = 2
critic_minibatches = 2
physics_timestep = 0.002
runtime_checks = "per_update"
cache_reference_heads = true
cache_goals = true
capture_imagination = true
capture_reset = true
mlp_precision = "bf16"
fused_optimizers = true
initial_save_iteration = 0
save_interval = 12
profile_every = 0
profile_iterations = 8
collective_timeout_seconds = 600
seed = 0
profile_cuda_ranks = true
