# Eight ranks, joint training of one tracker on nine named reference sequences.
[train]
robot_xml = "../assets/q1_v3/xml/q1_v3_mc.xml"
motion_dir = "../datasets/train_50hz/motion_lafan"
motion_manifest = "q1-starter-nine.txt"
output_dir = "../logs/q1-starter-nine"
device = "cuda:0"
motion_storage = "device"
max_motions = 0
num_envs = 8192
model_batch_size = 2048
policy_batch_size = 2048
iterations = 30000
replay_steps = 1000
model_batches = 2
critic_epochs = 2
critic_minibatches = 2
physics_timestep = 0.002
runtime_checks = "per_update"
cache_reference_heads = true
cache_goals = true
capture_imagination = true
capture_reset = true
mlp_precision = "bf16"
fused_optimizers = true
initial_save_iteration = 20
save_interval = 2000
profile_every = 250
profile_iterations = 30
collective_timeout_seconds = 600
seed = 0
